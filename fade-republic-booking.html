<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230b0b0b' width='32' height='32'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23c9a227' font-size='14' font-family='Georgia'%3EFR%3C/text%3E%3C/svg%3E" />
  <title>Book a chair — Fade Republic</title>
  <meta name="description" content="Working demo booking app for Fade Republic, a fictional barbershop. Choose a service, barber, and time, or view the owner dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0b0b;
      --panel: #121212;
      --raised: #181714;
      --line: #2a261c;
      --gold: #c9a227;
      --gold-soft: #e6d09a;
      --ivory: #f4eee3;
      --muted: #9a9386;
      --danger: #c45c4a;
      --ok: #8fa56e;
      --shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--ink);
      color: var(--ivory);
      line-height: 1.55;
      font-weight: 400;
      min-height: 100vh;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .demo-banner {
      background: var(--gold);
      color: #1a1406;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      font-weight: 500;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11,11,11,0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .header-row {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.85rem 1.1rem 0.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .wordmark {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .wordmark span { color: var(--gold); }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .ghost-btn, .reset-btn {
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 0.42rem 0.7rem;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
    }
    .ghost-btn:hover, .reset-btn:hover { border-color: var(--gold); color: var(--gold-soft); }
    .view-tabs {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.1rem 0.75rem;
      display: flex;
      gap: 0.4rem;
    }
    .view-tab {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--muted);
      border-radius: 999px;
    }
    .view-tab[aria-selected="true"] {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1406;
      font-weight: 500;
    }
    .view-tab:hover:not([aria-selected="true"]) { border-color: var(--gold); color: var(--gold-soft); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.4rem 1.1rem 4rem; }
    .eyebrow {
      color: var(--gold);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-bottom: 0.45rem;
    }
    h1, h2, .serif {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 0.95; margin-bottom: 0.55rem; }
    h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1; }
    .lede { color: var(--muted); max-width: 34rem; margin-bottom: 1.4rem; font-weight: 300; }

    .steps {
      display: flex;
      gap: 0.35rem;
      margin: 0 0 1.6rem;
      list-style: none;
    }
    .steps li {
      flex: 1;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .steps li span {
      display: block;
      height: 3px;
      background: var(--line);
      margin-bottom: 0.4rem;
    }
    .steps li.is-done span, .steps li.is-current span { background: var(--gold); }
    .steps li.is-current { color: var(--gold-soft); }

    .grid-services, .grid-barbers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.7rem;
    }
    .choice {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem 1rem;
      text-align: left;
      padding: 1rem 1.05rem;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ivory);
      border-radius: 2px;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .choice:hover { border-color: var(--gold); transform: translateY(-1px); }
    .choice.is-selected { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,39,0.1), rgba(201,162,39,0.03)); }
    .choice h3 { font-size: 1rem; font-weight: 500; letter-spacing: 0.03em; }
    .choice p { color: var(--muted); font-size: 0.84rem; font-weight: 300; margin-top: 0.2rem; }
    .choice .meta {
      text-align: right;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--gold-soft);
    }
    .choice .price { font-size: 1.45rem; line-height: 1; }
    .choice .dur { display: block; font-family: Outfit, sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }

    .barber-card {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 0.9rem;
      text-align: left;
    }
    .avatar {
      width: 3.1rem;
      height: 3.1rem;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--gold-soft);
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      background: radial-gradient(circle at 35% 30%, #2a2418, #0f0d0a);
    }
    .barber-card .role { color: var(--gold); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; }

    .dates {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }
    .date-chip, .slot {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ivory);
      border-radius: 2px;
    }
    .date-chip {
      padding: 0.55rem 0.15rem 0.6rem;
      text-align: center;
    }
    .date-chip .dow { display: block; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .date-chip .num { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.25rem; line-height: 1.1; }
    .date-chip.is-selected { border-color: var(--gold); background: rgba(201,162,39,0.12); color: var(--gold-soft); }
    .date-chip.is-selected .dow { color: var(--gold); }
    .date-chip:disabled, .slot:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      color: var(--muted);
    }
    .date-chip:not(:disabled):hover, .slot:not(:disabled):hover { border-color: var(--gold); }

    .slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
    }
    .slot { padding: 0.7rem 0.3rem; font-size: 0.88rem; }
    .slot.is-selected { border-color: var(--gold); background: var(--gold); color: #1a1406; font-weight: 500; }
    .empty-slots { color: var(--muted); padding: 1.2rem 0; }

    .form-grid { display: grid; gap: 0.9rem; }
    label { display: block; }
    label span {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ivory);
      padding: 0.8rem 0.9rem;
      border-radius: 2px;
    }
    input:focus { border-color: var(--gold); outline: none; }
    .hint { color: var(--muted); font-size: 0.82rem; font-weight: 300; }
    .error { color: var(--danger); font-size: 0.82rem; min-height: 1.1em; }

    .summary-card, .confirm-card, .stat, .appt, .chart-card, .dash-toolbar {
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .summary-card, .confirm-card, .chart-card { padding: 1.1rem 1.15rem; }
    .summary-card h3, .confirm-card h3 { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 500; font-family: Outfit, sans-serif; margin-bottom: 0.7rem; }
    .kv { display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--muted); }
    .confirm-code {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem;
      color: var(--gold-soft);
      letter-spacing: 0.08em;
      margin: 0.2rem 0 0.8rem;
    }

    .sticky-nav {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.4rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 1.2rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      border: 1px solid transparent;
      text-align: center;
    }
    .btn-gold { background: var(--gold); color: #1a1406; }
    .btn-gold:hover { background: var(--gold-soft); }
    .btn-ghost { border-color: var(--line); color: var(--ivory); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #1a0c0a; }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    .grow { flex: 1; }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.65rem;
      margin: 1.1rem 0;
    }
    .stat { padding: 0.95rem 1rem; }
    .stat label { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .stat b { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.85rem; font-weight: 500; color: var(--gold-soft); line-height: 1.1; margin-top: 0.2rem; }

    .dash-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      padding: 0.7rem;
      margin-bottom: 0.9rem;
      align-items: center;
    }
    .seg { display: flex; gap: 0.3rem; flex: 1; }
    .seg button, .barber-filter {
      border: 1px solid var(--line);
      padding: 0.45rem 0.7rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border-radius: 999px;
    }
    .seg button.is-on { background: var(--gold); color: #1a1406; border-color: var(--gold); }
    .barber-filter { background: var(--ink); color: var(--ivory); }

    .chart-card { margin-bottom: 0.9rem; }
    .chart-card h3 { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; font-family: Outfit, sans-serif; margin-bottom: 0.6rem; }
    #booking-chart { width: 100%; height: 190px; }

    .appt-list { display: grid; gap: 0.55rem; }
    .appt {
      padding: 0.9rem 1rem;
      display: grid;
      gap: 0.25rem;
    }
    .appt-top { display: flex; justify-content: space-between; gap: 0.6rem; align-items: baseline; }
    .appt-time { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.2rem; color: var(--gold-soft); }
    .status {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .status.booked { color: var(--gold); border-color: var(--gold); }
    .status.completed { color: var(--ok); border-color: #3d4a30; }
    .status.cancelled { color: var(--danger); border-color: #5a322c; }
    .appt.is-cancelled { opacity: 0.55; }
    .appt-actions { display: flex; gap: 0.4rem; margin-top: 0.45rem; flex-wrap: wrap; }
    .appt-actions .btn { padding: 0.45rem 0.7rem; font-size: 0.65rem; }
    .appt-sub { color: var(--muted); font-size: 0.84rem; }

    .empty { color: var(--muted); padding: 1.5rem 0.2rem; text-align: center; }

    footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.1rem 2rem;
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-top: 1.2rem;
    }
    footer a:hover { color: var(--gold-soft); }

    @media (min-width: 720px) {
      .grid-services { grid-template-columns: 1fr 1fr; }
      .grid-barbers { grid-template-columns: 1fr 1fr 1fr; }
      .slots { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .header-row { padding: 0.95rem 1.4rem 0.65rem; }
      .view-tabs { padding: 0 1.4rem 0.9rem; }
      .view-tab { flex: 0 0 auto; padding: 0.5rem 1.05rem; }
      .wordmark { font-size: 1.3rem; }
      main { padding: 2rem 1.4rem 5rem; }
      .split { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1.3rem; align-items: start; }
      .sticky-side { position: sticky; top: 6.5rem; }
    }
    @media (min-width: 960px) {
      .dates { gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="demo-banner" data-testid="demo-banner">Demo app for a fictional business. No real bookings are made.</div>
  <header class="site-header">
    <div class="header-row">
      <a class="wordmark" href="fade-republic.html">Fade <span>Republic</span></a>
      <div class="header-actions">
        <a class="ghost-btn" href="index.html">SitesByAnt</a>
        <button type="button" class="reset-btn" data-testid="reset-demo" id="reset-demo">Reset demo</button>
      </div>
    </div>
    <div class="view-tabs" role="tablist" aria-label="App views">
      <button type="button" class="view-tab" role="tab" id="tab-book" data-testid="tab-book" aria-selected="true">Book a chair</button>
      <button type="button" class="view-tab" role="tab" id="tab-owner" data-testid="tab-owner" aria-selected="false">Owner dashboard</button>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <span>Fade Republic Barbers · 214 Ledger Lane, Eastmere</span>
    <span>Portfolio sample for a fictional business · <a href="index.html">SitesByAnt</a></span>
  </footer>

  <script>
  (function () {
    const STORAGE_KEY = "fade-republic-booking-demo-v1";

    const SERVICES = [
      { id: "classic-cut", name: "Classic Cut", desc: "Scissor work with a clean outline. Tidy, not trendy.", price: 32, duration: 30 },
      { id: "skin-fade", name: "Skin Fade", desc: "Tight blend to the skin, finished at the ears and neckline.", price: 40, duration: 45 },
      { id: "beard-sculpt", name: "Beard Sculpt", desc: "Line-up, shape, and oil. Cheek and neck cleaned sharp.", price: 25, duration: 20 },
      { id: "cut-beard", name: "Cut + Beard", desc: "The full chair. Hair and beard treated as one shape.", price: 55, duration: 60 },
      { id: "hot-towel", name: "Hot Towel Shave", desc: "Warm towel, close shave, and a cold finish.", price: 35, duration: 45 },
      { id: "gray-blend", name: "Gray Blending", desc: "Soft tone work for temples and beards. Never painted-on.", price: 45, duration: 45 },
      { id: "kids-cut", name: "Kid’s Cut", desc: "Ages 12 and under. Patient chair, same standard of finish.", price: 22, duration: 30 },
      { id: "shape-up", name: "Shape-Up Only", desc: "Hairline, beard line, and neck. A midweek tidy.", price: 18, duration: 15 }
    ];

    const BARBERS = [
      { id: "marcus", name: "Marcus Hale", initials: "MH", role: "Senior barber", note: "Fades and classic cuts. In the chair since the shop opened." },
      { id: "jonah", name: "Jonah Reyes", initials: "JR", role: "Barber", note: "Beards, hot-towel shaves, and gray blending." },
      { id: "camille", name: "Camille Hart", initials: "CH", role: "Barber", note: "Precision line-ups and a patient chair for kids." }
    ];

    const CUSTOMERS = [
      { name: "Devon Clarke", phone: "(555) 014-3301" },
      { name: "Priya Shah", phone: "(555) 014-4482" },
      { name: "Luis Navarro", phone: "(555) 014-2198" },
      { name: "Amina Brooks", phone: "(555) 014-7720" },
      { name: "Theo Park", phone: "(555) 014-5603" },
      { name: "Grace Lin", phone: "(555) 014-8814" },
      { name: "Omar Bennett", phone: "(555) 014-1936" },
      { name: "Elena Vasquez", phone: "(555) 014-6409" },
      { name: "Chris Nguyen", phone: "(555) 014-2755" },
      { name: "Jordan Miles", phone: "(555) 014-9012" },
      { name: "Samira Cole", phone: "(555) 014-3344" },
      { name: "Brett Holloway", phone: "(555) 014-1180" },
      { name: "Nina Patel", phone: "(555) 014-7291" },
      { name: "Isaac Rowe", phone: "(555) 014-4550" },
      { name: "Maya Chen", phone: "(555) 014-6088" }
    ];

    const HOURS = {
      0: null,
      1: { open: "10:00", close: "19:00" },
      2: { open: "10:00", close: "19:00" },
      3: { open: "10:00", close: "19:00" },
      4: { open: "10:00", close: "20:00" },
      5: { open: "09:00", close: "20:00" },
      6: { open: "08:00", close: "17:00" }
    };

    const state = {
      view: "book",
      step: 1,
      serviceId: null,
      barberId: null,
      date: null,
      time: null,
      name: "",
      phone: "",
      formError: "",
      lastBooking: null,
      dashRange: "today",
      dashBarber: "all",
      bookings: []
    };

    const app = document.getElementById("app");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toISODate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
    function parseISODate(iso) { const [y, m, day] = iso.split("-").map(Number); return new Date(y, m - 1, day); }
    function todayISO() { return toISODate(new Date()); }
    function toMinutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
    function fromMinutes(mins) { return pad(Math.floor(mins / 60)) + ":" + pad(mins % 60); }
    function formatTime(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      const suffix = h >= 12 ? "PM" : "AM";
      return (h % 12 || 12) + ":" + pad(m) + " " + suffix;
    }
    function formatDateLong(iso) {
      return parseISODate(iso).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    }
    function formatDateShort(iso) {
      return parseISODate(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }
    function money(n) { return "$" + n.toLocaleString("en-US"); }
    function findService(id) { return SERVICES.find(function (s) { return s.id === id; }); }
    function findBarber(id) { return BARBERS.find(function (b) { return b.id === id; }); }
    function overlaps(startA, durA, startB, durB) {
      const a1 = toMinutes(startA), a2 = a1 + durA, b1 = toMinutes(startB), b2 = b1 + durB;
      return a1 < b2 && b1 < a2;
    }
    function isPastSlot(iso, hhmm) {
      const d = parseISODate(iso);
      const [h, m] = hhmm.split(":").map(Number);
      d.setHours(h, m, 0, 0);
      return d.getTime() <= Date.now();
    }
    function weekMonday(d) {
      const day = d.getDay();
      const offset = day === 0 ? -6 : 1 - day;
      return startOfDay(addDays(d, offset));
    }
    function activeBookings() {
      return state.bookings.filter(function (b) { return b.status !== "cancelled"; });
    }
    function slotsFor(iso, barberId, duration, ignoreId) {
      const date = parseISODate(iso);
      const hours = HOURS[date.getDay()];
      if (!hours) return [];
      const open = toMinutes(hours.open);
      const close = toMinutes(hours.close);
      const taken = activeBookings().filter(function (b) {
        return b.date === iso && b.barberId === barberId && b.id !== ignoreId;
      });
      const out = [];
      for (let t = open; t + duration <= close; t += 15) {
        const start = fromMinutes(t);
        const blocked = taken.some(function (b) { return overlaps(start, duration, b.start, b.duration); });
        const past = isPastSlot(iso, start);
        out.push({ start: start, available: !blocked && !past, reason: past ? "past" : blocked ? "taken" : "" });
      }
      return out;
    }

    function buildSeed() {
      const out = [];
      const today = startOfDay(new Date());
      const start = weekMonday(today);
      const end = addDays(today, 13);
      let i = 0;
      const candidateHours = [8, 9, 10, 10.5, 11, 12, 13, 14, 14.5, 15, 16, 16.5, 17, 18];
      for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
        if (d.getDay() === 0) continue;
        const iso = toISODate(d);
        const hours = HOURS[d.getDay()];
        const open = toMinutes(hours.open);
        const close = toMinutes(hours.close);
        const count = 3 + (d.getDate() % 3);
        const used = { marcus: [], jonah: [], camille: [] };
        let placed = 0;
        for (let n = 0; n < candidateHours.length && placed < count; n++) {
          const mins = Math.round(candidateHours[(n + d.getDate()) % candidateHours.length] * 60);
          if (mins < open || mins >= close) continue;
          const service = SERVICES[(i + placed * 2) % SERVICES.length];
          if (mins + service.duration > close) continue;
          const barber = BARBERS[(i + placed) % BARBERS.length];
          const startStr = fromMinutes(mins);
          if (used[barber.id].some(function (b) { return overlaps(startStr, service.duration, b.start, b.duration); })) continue;
          used[barber.id].push({ start: startStr, duration: service.duration });
          const customer = CUSTOMERS[(i + placed) % CUSTOMERS.length];
          const past = isPastSlot(iso, startStr);
          let status = past ? "completed" : "booked";
          if (!past && placed === count - 1 && d.getDate() % 5 === 0) status = "cancelled";
          out.push({
            id: "seed-" + iso + "-" + placed,
            code: makeCode(iso + placed + barber.id),
            serviceId: service.id,
            serviceName: service.name,
            barberId: barber.id,
            barberName: barber.name,
            date: iso,
            start: startStr,
            duration: service.duration,
            price: service.price,
            customerName: customer.name,
            phone: customer.phone,
            status: status,
            createdAt: addDays(d, -3).toISOString()
          });
          placed++;
        }
        i += 3;
      }
      return out;
    }

    function makeCode(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "FR-";
      for (let i = 0; i < 5; i++) {
        out += alphabet[(h >>> (i * 5)) & 31];
      }
      return out;
    }

    function nextFourteenDays() {
      const days = [];
      const today = startOfDay(new Date());
      for (let i = 0; i < 14; i++) days.push(addDays(today, i));
      return days;
    }

    function firstOpenDate() {
      const service = findService(state.serviceId);
      const days = nextFourteenDays();
      for (let i = 0; i < days.length; i++) {
        const iso = toISODate(days[i]);
        if (days[i].getDay() === 0) continue;
        const slots = slotsFor(iso, state.barberId, service.duration);
        if (slots.some(function (s) { return s.available; })) return iso;
      }
      return toISODate(days[0]);
    }

    function icsFor(booking) {
      const start = parseISODate(booking.date);
      const [h, m] = booking.start.split(":").map(Number);
      start.setHours(h, m, 0, 0);
      const end = new Date(start.getTime() + booking.duration * 60000);
      function icsDate(d) {
        return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
      }
      const stamp = icsDate(new Date());
      const summary = booking.serviceName + " with " + booking.barberName;
      const desc = "Fade Republic demo appointment (" + booking.code + "). Not a real booking.";
      const body = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Fade Republic//Booking Demo//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        "UID:" + booking.id + "@faderepublic.example",
        "DTSTAMP:" + stamp,
        "DTSTART:" + icsDate(start),
        "DTEND:" + icsDate(end),
        "SUMMARY:" + summary,
        "DESCRIPTION:" + desc,
        "LOCATION:214 Ledger Lane, Eastmere",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");
      return body;
    }

    function downloadIcs(booking) {
      const blob = new Blob([icsFor(booking)], { type: "text/calendar;charset=utf-8" });

      const a = document.createElement("a");
      a.href = url;
      a.download = "fade-republic-" + booking.code + ".ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function filteredAppointments() {
      const today = todayISO();
      return state.bookings.filter(function (b) {
        if (state.dashBarber !== "all" && b.barberId !== state.dashBarber) return false;
        if (state.dashRange === "today") return b.date === today;
        return b.date > today || (b.date === today && !isPastSlot(b.date, b.start));
      }).sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return toMinutes(a.start) - toMinutes(b.start);
      });
    }

    function revenue(range) {
      const today = startOfDay(new Date());
      const mon = weekMonday(today);
      const sun = addDays(mon, 6);
      const todayIso = toISODate(today);
      return state.bookings.reduce(function (sum, b) {
        if (b.status === "cancelled") return sum;
        const d = parseISODate(b.date);
        if (range === "today" && b.date !== todayIso) return sum;
        if (range === "week" && (d < mon || d > sun)) return sum;
        return sum + b.price;
      }, 0);
    }

    function renderChart() {
      const el = document.getElementById("booking-chart");
      if (!el) return;
      const days = nextFourteenDays();
      const counts = days.map(function (d) {
        const iso = toISODate(d);
        return activeBookings().filter(function (b) {
          if (b.date !== iso) return false;
          if (state.dashBarber !== "all" && b.barberId !== state.dashBarber) return false;
          return true;
        }).length;
      });
      const max = Math.max.apply(null, counts.concat([1]));
      const w = Math.max(el.clientWidth || 640, 320);
      const h = 190;
      const padT = 18, padR = 6, padB = 36, padL = 6;
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;
      const barW = innerW / days.length;
      let svg = '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="' + h + '" role="img" aria-label="Bookings per day for the next two weeks">';
      counts.forEach(function (c, i) {
        const bh = (c / max) * innerH;
        const x = padL + i * barW;
        const y = padT + innerH - bh;
        const iso = toISODate(days[i]);
        const closed = days[i].getDay() === 0;
        const fill = closed ? "#1c1a16" : c ? "#c9a227" : "#2a261c";
        const label = days[i].toLocaleDateString("en-US", { weekday: "narrow" });
        svg += '<rect x="' + (x + 3) + '" y="' + y + '" width="' + Math.max(barW - 6, 4) + '" height="' + Math.max(bh, c ? 3 : 0) + '" fill="' + fill + '" data-date="' + iso + '"></rect>';
        svg += '<text x="' + (x + barW / 2) + '" y="' + (h - 18) + '" text-anchor="middle" fill="#9a9386" font-size="10" font-family="Outfit, sans-serif">' + label + "</text>";
        svg += '<text x="' + (x + barW / 2) + '" y="' + (h - 6) + '" text-anchor="middle" fill="#9a9386" font-size="9" font-family="Outfit, sans-serif">' + days[i].getDate() + "</text>";

      svg += "</svg>";
      el.innerHTML = svg;

        return '<article class="appt' + cancelled + '" data-testid="appt-row" data-id="' + b.id + '">' +
          '<div class="appt-top"><div class="appt-time">' + formatTime(b.start) + " · " + formatDateShort(b.date) + "</div>" +
          '<span class="status ' + b.status + '">' + b.status + "</span></div>" +
          '<div><strong>' + escapeHtml(b.customerName) + "</strong></div>" +
          '<div class="appt-sub">' + escapeHtml(b.serviceName) + " · " + escapeHtml(b.barberName) + " · " + money(b.price) + " · " + escapeHtml(b.phone) + "</div>" +
          actions + "</article>";
      }).join("") : '<p class="empty" data-testid="empty-appts">No appointments in this view.</p>';

      app.innerHTML =
        '<p class="eyebrow">Shop owner</p>' +
        "<h1>The book.</h1>" +
        '<p class="lede">Today’s chairs, the week’s numbers, and what’s coming up. Demo data is already on the book — add a booking to see it appear here.</p>' +
        '<div class="stats">' +
        '<div class="stat"><label>Today’s appointments</label><b data-testid="count-today">' + todayCount + "</b></div>" +
        '<div class="stat"><label>Today’s revenue</label><b data-testid="revenue-today">' + money(revenue("today")) + "</b></div>" +
        '<div class="stat"><label>This week’s revenue</label><b data-testid="revenue-week">' + money(revenue("week")) + "</b></div>" +
        "</div>" +
        '<div class="chart-card"><h3>Bookings per day · next 14 days</h3><div id="booking-chart" data-testid="booking-chart"></div></div>' +
        '<div class="dash-toolbar">' +
        '<div class="seg" role="group" aria-label="Appointment range">' +
        '<button type="button" data-range="today" class="' + (state.dashRange === "today" ? "is-on" : "") + '" data-testid="filter-today">Today</button>' +
        '<button type="button" data-range="upcoming" class="' + (state.dashRange === "upcoming" ? "is-on" : "") + '" data-testid="filter-upcoming">Upcoming</button>' +
        "</div>" +
        '<select class="barber-filter" data-testid="filter-barber" aria-label="Filter by barber">' +
        '<option value="all"' + (state.dashBarber === "all" ? " selected" : "") + ">All barbers</option>" + options +
        "</select></div>" +
        '<div class="appt-list" data-testid="appt-list">' + rows + "</div>";

      renderChart();
      app.querySelectorAll("[data-range]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.dashRange = btn.getAttribute("data-range");
          render();
        });
      });
      app.querySelector("[data-testid=filter-barber]").addEventListener("change", function (e) {
        state.dashBarber = e.target.value;
        render();
      });
      app.querySelectorAll("[data-testid=mark-complete]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          updateStatus(btn.getAttribute("data-id"), "completed");
        });
      });
      app.querySelectorAll("[data-testid=mark-cancel]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          updateStatus(btn.getAttribute("data-id"), "cancelled");
        });
      });
    }

    function updateStatus(id, status) {
      saveBookings(state.bookings.map(function (b) {
        if (b.id !== id) return b;
        return Object.assign({}, b, { status: status });
      }));
      render();
    }

    function render() {
      document.getElementById("tab-book").setAttribute("aria-selected", state.view === "book" ? "true" : "false");
      document.getElementById("tab-owner").setAttribute("aria-selected", state.view === "owner" ? "true" : "false");
      if (state.view === "owner") renderOwner();
      else renderBook();
    }

    document.getElementById("tab-book").addEventListener("click", function () {
      state.view = "book";
      render();
    });
    document.getElementById("tab-owner").addEventListener("click", function () {
      state.view = "owner";
      render();
    });
    document.getElementById("reset-demo").addEventListener("click", resetDemo);
    window.addEventListener("resize", function () {
      if (state.view === "owner") renderChart();
    });

    state.bookings = loadBookings();
    render();
  })();
  </script>
</body>
</html>
